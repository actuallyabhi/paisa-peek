{% extends "base.html" %}{% load i18n %}
{% block title %}{{ r.name }}{% endblock %}
{% block content %}
<a href="{% url 'recurring' %}" class="text-sm text-muted hover:underline">← {% translate "Recurring" %}</a>
<h1 class="mb-4 mt-1 text-xl font-semibold sm:text-2xl">{{ r.name }}</h1>
<form method="post" class="card space-y-3 p-4">{% include "ledger/_form.html" %}<button class="btn w-full sm:w-auto">{% translate "Save" %}</button></form>
<form method="post" class="mt-4" onsubmit="return confirm('{% blocktranslate with name=r.name|escapejs %}Delete {{ name }}?{% endblocktranslate %}')">
  {% csrf_token %}<input type="hidden" name="action" value="delete"><button class="text-sm text-bad hover:underline">{% translate "Delete" %}</button>
</form>
{% endblock %}
